apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: social-api

  template:
    metadata:
      labels:
        app: social-api

    spec:
      containers:
      - name: social-api

        image: us-central1-docker.pkg.dev/omarfkuri/docker-repo/social-api:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        env:
        - name: SERVER_PORT
          value: "8080"

        - name: SPRING_PROFILES_ACTIVE
          value: "prod"

        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: social-secrets
              key: DB_URL

        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: social-secrets
              key: DB_USER

        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: social-secrets
              key: DB_PASS